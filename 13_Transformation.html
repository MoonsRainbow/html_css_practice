<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>13: Transformation</title>
        <style>
            img {
                border: 5px solid black;
                border-radius: 50%;
                /* transform:rotateY(45deg) rotateX(20deg); */
                transition: transform 1s ease-in-out;
            }
            img:hover {
                transform: rotateY(360deg) scale(0.5); 
            }
        </style>
    </head>
    <body>
        <img src="image/logo.png"/>
        <!-- <span>Hello</span> -->
    </body>
</html>
