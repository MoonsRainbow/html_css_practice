<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>14: Animation</title>
        <style>
            @keyframes aniCoinFlip {
                /* from {
                    transform: rotateY(0);
                }
                to {
                    transform: rotateY(180deg) translateX(100px);
                } */
                 0% {
                    transform: rotateY(0);
                 }
                 50% {
                    transform: rotateY(180deg) translateY(-100px);
                 }
                 100% {
                    transform: rotateY(0) translateY(0);
                 }
            }
            img {
                border: 5px solid black;
                border-radius: 50%;
                animation: aniCoinFlip 5s ease-in-out infinite;
            }
            div {
                display: flex;
                width: 100vw;
                height: 100vh;
                justify-content: center;
                align-items: center;
            }
        </style>
    </head>
    <body>
        <div>
            <img src="image/logo.png"/>
        </div>
    </body>
</html>
