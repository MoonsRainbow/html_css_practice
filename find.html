<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Find - Kokoa Clone</title>
		<link
			rel="stylesheet"
			href="css/styles.css"
		/>
	</head>
	<body>
		<div class="status-bar">
			<div class="status-bar__column">
				<span>No Service</span>
				<i class="icon-wifi status-bar__column__icon"></i>
			</div>
			<div class="status-bar__column">
				<span>18:43</span>
			</div>
			<div class="status-bar__column">
				<span>100%</span>
				<i class="icon-battery-full status-bar__column__icon"></i>
				<i class="icon-zap status-bar__column__icon"></i>
			</div>
		</div>
		<header class="screen-header">
			<h1 class="screen-header__title font-bold">Find</h1>
			<div class="screen-header__icon-group">
				<a
					href="#"
					class="screen-header__icon-group__icon"
					><i class="icon-search"></i
				></a>
				<a
					href="#"
					class="screen-header__icon-group__icon screen-header__icon-group__icon-relative"
					><span
						class="badge__noti badge__noti__nav-bar badge__dots badge__dots__nav-bar font-semi-bold"
						>·</span
					><i class="icon-settings"></i
				></a>
			</div>
		</header>
		<main class="main-screen">
			<div class="icon-rows__group">
				<div class="icon-rows__column">
					<i class="icon-scan-line icon-rows__icon-large"></i>
					<span class="font-semi-bold">QR Code</span>
				</div>
				<div class="icon-rows__column">
					<i class="icon-book-user icon-rows__icon-large"></i>
					<span class="font-semi-bold">Add by Contacts</span>
				</div>
				<div class="icon-rows__column">
					<i class="icon-user-round-plus icon-rows__icon-large"></i>
					<span class="font-semi-bold">Add by ID</span>
				</div>
				<div class="icon-rows__column">
					<i class="icon-mail-open icon-rows__icon-large"></i>
					<span class="font-semi-bold">Invite</span>
				</div>
			</div>
			<div class="find__recommend-friends">
				<span class="font-dark-gray">Recommended Friends</span>
				<div class="find__recommend-friends__list">
					<span class="font-gray">You have no recommended friends.</span>
				</div>
			</div>
			<div class="find__open-chat">
				<div class="find__open-chat__header">
					<span class="font-dark-gray">Open Chat</span>
				</div>
				<div class="find__open-chat__open-post">
					<div class="open-post__column">
						<h5 class="open-post__title">#BTS</h5>
						<h6 class="open-post__hashtags font-gray">#bts#army#friends</h6>
						<div class="open-post__members">
							<img
								class="open-post__member-avatar"
								src="resource/github-mark.svg"
							/>
							<span class="font-gray">802 members</span>
							<div class="divider"></div>
							<span class="open-post__member-status">Active</span>
						</div>
					</div>
					<div class="open-post__column">
						<img
							src="resource/moons-rainbow.png"
							class="open-post__title-image"
						/>
						<div class="open-post__likes">
							<i class="icon-heart font-black-bold"></i>
							2,326
						</div>
					</div>
				</div>
			</div>
		</main>
		<nav class="nav-bar">
			<ul class="nav-bar__list">
				<li class="nav-bar__btn">
					<a
						href="friends.html"
						class="nav-bar__column__icon"
						><i class="icon-user-round font-dark-gray"></i
					></a>
				</li>
				<li class="nav-bar__btn">
					<a
						href="chats.html"
						class="nav-bar__column__icon"
					>
						<span
							class="badge__noti badge__noti__nav-bar badge__counts badge__counts__nav-bar font-semi-bold"
							>1</span
						><i class="icon-message-circle-more font-dark-gray"></i
					></a>
				</li>
				<li class="nav-bar__btn">
					<a
						href="find.html"
						class="nav-bar__column__icon"
						><i class="icon-search font-black-bold"></i
					></a>
				</li>
				<li class="nav-bar__btn">
					<a
						href="more.html"
						class="nav-bar__column__icon"
						><span
							class="badge__noti badge__noti__nav-bar badge__dots badge__dots__nav-bar font-semi-bold"
							>·</span
						><i class="icon-ellipsis font-dark-gray"></i
					></a>
				</li>
			</ul>
		</nav>
	</body>
</html>
