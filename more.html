<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>More - Kokoa Clone</title>
		<link
			rel="stylesheet"
			href="css/styles.css"
		/>
	</head>
	<body>
		<div class="status-bar">
			<div class="status-bar__column">
				<span>No Service</span>
				<i class="icon-wifi status-bar__column__icon"></i>
			</div>
			<div class="status-bar__column">
				<span>18:43</span>
			</div>
			<div class="status-bar__column">
				<span>100%</span>
				<i class="icon-battery-full status-bar__column__icon"></i>
				<i class="icon-zap status-bar__column__icon"></i>
			</div>
		</div>
		<header class="screen-header">
			<h1 class="screen-header__title font-bold">More</h1>
			<div class="screen-header__icon-group">
				<a
					href="#"
					class="screen-header__icon-group__icon"
					><i class="icon-search"></i
				></a>
				<a
					href="#"
					class="screen-header__icon-group__icon"
					><i class="icon-music"></i
				></a>
				<a
					href="settings.html"
					class="screen-header__icon-group__icon screen-header__icon-group__icon-relative"
					><span
						class="badge__noti badge__noti__nav-bar badge__dots badge__dots__nav-bar font-semi-bold"
						>·</span
					><i class="icon-settings"></i
				></a>
			</div>
		</header>
		<main class="main-screen">
			<div class="user-component">
				<div class="user-component__column">
					<img
						src="resource/moons-rainbow.png"
						class="user-component__avatar user-component__avatar-large"
					/>
					<div class="user-component__info-box">
						<h4 class="user-component__title font-semi-bold">Moons Rainbow</h4>
						<h6 class="user-component__text font-gray">
							+87 10-0000-0000
							<i class="icon-circle-alert"></i>
						</h6>
					</div>
				</div>
				<div class="user_component__col font-dark-gray">
					<i class="icon-message-square-text user-component__icon-large"></i>
				</div>
			</div>
			<div class="icon-rows__group icon-rows__group-padding">
				<div class="icon-rows__column">
					<i class="icon-calendar-check-2 icon-rows__icon"></i
					><span>Calendar</span>
				</div>
				<div class="icon-rows__column">
					<i class="icon-archive icon-rows__icon"></i><span>Talk Drive</span>
				</div>
				<div class="icon-rows__column">
					<i class="icon-smile icon-rows__icon"></i><span>Emoticons</span>
				</div>
				<div class="icon-rows__column">
					<i class="icon-brush-cleaning icon-rows__icon"></i><span>Themes</span>
				</div>
				<div class="icon-rows__column">
					<i class="icon-circle-user-round icon-rows__icon"></i
					><span>Account</span>
				</div>
				<div class="icon-rows__column">
					<i class="icon-messages-square icon-rows__icon"></i
					><span>Openchat</span>
				</div>
			</div>
		</main>
		<nav class="nav-bar">
			<ul class="nav-bar__list">
				<li class="nav-bar__btn">
					<a
						href="friends.html"
						class="nav-bar__column__icon"
						><i class="icon-user-round font-dark-gray"></i
					></a>
				</li>
				<li class="nav-bar__btn">
					<a
						href="chats.html"
						class="nav-bar__column__icon"
					>
						<span
							class="badge__noti badge__noti__nav-bar badge__counts badge__counts__nav-bar font-semi-bold"
							>1</span
						><i class="icon-message-circle-more font-dark-gray"></i
					></a>
				</li>
				<li class="nav-bar__btn">
					<a
						href="find.html"
						class="nav-bar__column__icon"
						><i class="icon-search font-dark-gray"></i
					></a>
				</li>
				<li class="nav-bar__btn">
					<a
						href="more.html"
						class="nav-bar__column__icon"
						><span
							class="badge__noti badge__noti__nav-bar badge__dots badge__dots__nav-bar font-semi-bold"
							>·</span
						><i class="icon-ellipsis font-black-bold"></i
					></a>
				</li>
			</ul>
		</nav>
	</body>
</html>
