<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Settings - Kokoa Clone</title>
		<link
			rel="stylesheet"
			href="css/styles.css"
		/>
	</head>
	<body>
		<div class="status-bar">
			<div class="status-bar__column">
				<span>No Service</span>
				<i class="icon-wifi status-bar__column__icon"></i>
			</div>
			<div class="status-bar__column">
				<span>18:43</span>
			</div>
			<div class="status-bar__column">
				<span>100%</span>
				<i class="icon-battery-full status-bar__column__icon"></i>
				<i class="icon-zap status-bar__column__icon"></i>
			</div>
		</div>
		<header class="alt-screen-header">
			<div class="alt-screen-header__column">
				<a href="more.html">
					<i class="icon-chevron-left alt-screen-header__icon"></i>
				</a>
			</div>
			<div class="alt-screen-header__column">
				<span class="alt-screen-header__title">Settings</span>
			</div>
			<div class="alt-screen-header__column">
				<div class="alt-screen-header__icon-group">
					<i class="icon-search alt-screen-header__icon"></i>
				</div>
			</div>
		</header>
		<main class="main-screen">
			<ul class="settings__list">
				<li class="settings__setting">
					<div class="settings__setting__column">
						<i class="icon-megaphone"></i><span>Notices</span>
					</div>
					<div class="settings__setting__column"></div>
				</li>
				<li class="settings__setting">
					<div class="settings__setting__column">
						<i class="icon-flask-conical"></i><span>KoKoa Lab</span>
					</div>
					<div class="settings__setting__column"></div>
				</li>
				<li class="settings__setting">
					<div class="settings__setting__column">
						<i class="icon-info"></i><span>Version</span>
					</div>
					<div class="settings__setting__column">
						<span class="settins__setting__text font-gray">Latest Version</span>
					</div>
				</li>
			</ul>
		</main>
		<nav class="nav-bar">
			<ul class="nav-bar__list">
				<li class="nav-bar__btn">
					<a
						href="friends.html"
						class="nav-bar__column__icon"
						><i class="icon-user-round font-dark-gray"></i
					></a>
				</li>
				<li class="nav-bar__btn">
					<a
						href="chats.html"
						class="nav-bar__column__icon"
					>
						<span
							class="badge__noti badge__noti__nav-bar badge__counts badge__counts__nav-bar font-semi-bold"
							>1</span
						><i class="icon-message-circle-more font-dark-gray"></i
					></a>
				</li>
				<li class="nav-bar__btn">
					<a
						href="find.html"
						class="nav-bar__column__icon"
						><i class="icon-search font-dark-gray"></i
					></a>
				</li>
				<li class="nav-bar__btn">
					<a
						href="more.html"
						class="nav-bar__column__icon"
						><span
							class="badge__noti badge__noti__nav-bar badge__dots badge__dots__nav-bar font-semi-bold"
							>·</span
						><i class="icon-ellipsis font-dark-gray"></i
					></a>
				</li>
			</ul>
		</nav>
	</body>
</html>
