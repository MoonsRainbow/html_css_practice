<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Friends - Kokoa Clone</title>
		<link
			rel="stylesheet"
			href="css/styles.css"
		/>
	</head>
	<body>
		<div class="status-bar">
			<div class="status-bar__column">
				<span>No Service</span>
				<i class="icon-wifi status-bar__column__icon"></i>
			</div>
			<div class="status-bar__column">
				<span>18:43</span>
			</div>
			<div class="status-bar__column">
				<span>100%</span>
				<i class="icon-battery-full status-bar__column__icon"></i>
				<i class="icon-zap status-bar__column__icon"></i>
			</div>
		</div>
		<header class="screen-header">
			<h1 class="screen-header__title font-bold">Friends</h1>
			<div class="screen-header__icon-group">
				<a
					href="#"
					class="screen-header__icon-group__icon"
					><i class="icon-search"></i
				></a>
				<a
					href="#"
					class="screen-header__icon-group__icon"
					><i class="icon-music"></i
				></a>
				<a
					href="#"
					class="screen-header__icon-group__icon"
					><i class="icon-settings"></i
				></a>
			</div>
		</header>
		<a
			href="#"
			id="friends-display-link"
		>
			<i class="icon-info friends-display-link__icon"></i>
			<span class="friends-display-link__text">Friends' Names Display</span>
			<i class="icon-chevron-right friends-display-link__icon"></i>
		</a>
		<main class="friends__screen">
			<div class="user-component">
				<div class="user-component__column">
					<img
						src="resource/moons-rainbow.png"
						class="user-component__avatar user-component__avatar-large"
					/>
					<div class="user-component__info-box">
						<h4 class="user-component__title font-semi-bold">Moons Rainbow</h4>
					</div>
				</div>
				<div class="user-component__column"></div>
			</div>
			<div class="friends-screen__channel">
				<div class="friends-screen__channel-header">
					<span class="friends-screen__channel-header__title font-gray">
						Channel
					</span>
				</div>
				<div class="user-component">
					<div class="user-component__column">
						<img
							src="resource/github-mark.svg"
							class="user-component__avatar user-component__avatar-small"
						/>
						<div class="user-component__info-box">
							<h4 class="user-component__title">Github</h4>
						</div>
					</div>
					<div class="user-component__column">
						<div
							class="user-component__action-box user-component__action-box-horizontal"
						>
							<span class="user-component__text font-gray">2</span>
							<i class="icon-chevron-right user-component__icon font-gray"></i>
						</div>
					</div>
				</div>
			</div>
		</main>
		<nav class="nav-bar">
			<ul class="nav-bar__list">
				<li class="nav-bar__btn">
					<a
						href="#"
						class="nav-bar__column__icon"
						><i class="icon-user-round"></i
					></a>
				</li>
				<li class="nav-bar__btn">
					<a
						href="#"
						class="nav-bar__column__icon"
					>
						<span class="nav-bar__noti nav-bar__counts font-semi-bold">1</span
						><i class="icon-message-circle-more"></i
					></a>
				</li>
				<li class="nav-bar__btn">
					<a
						href="#"
						class="nav-bar__column__icon"
						><i class="icon-search"></i
					></a>
				</li>
				<li class="nav-bar__btn">
					<a
						href="#"
						class="nav-bar__column__icon"
						><span class="nav-bar__noti nav-bar__dots font-semi-bold">·</span
						><i class="icon-ellipsis"></i
					></a>
				</li>
			</ul>
		</nav>
	</body>
</html>
